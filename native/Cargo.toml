[workspace]
members = ["vnt", "vnt-jni"]

[profile.release]
opt-level = 'z'
debug = 0
debug-assertions = false
# 保留符号以便崩溃时能从 logcat / tombstone 定位问题。
strip = "none"
lto = true
# 不能使用 abort：1.x 核心在 Android 路径上有不少 unwrap/unsafe，
# abort 会让任何 panic 直接终止进程，表现为应用闪退且日志来不及写入。
# unwind 允许 panic 被 JNI 边界的 catch_unwind 拦截并转成 Java 异常。
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
